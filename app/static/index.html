<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkify</title>
    <meta name="description" content="Voice-Based Automated Task Management Application">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="app">

        <header class="header">
            <div>
                <h1>Welcome to Talkify</h1>
                <p>Voice-Based Automated Task Management Application</p>
            </div>

            <button id="voiceButton" class="voice-button">
                Record
            </button>
        </header>


        <section class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
            >

            <button id="addTaskButton">
                Add Task
            </button>

        </section>


        <nav class="filters">

            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="active">
                Active
            </button>

            <button class="filter" data-filter="completed">
                Completed
            </button>

            <button class="filter" data-filter="pending">
                Pending
            </button>

        </nav>


        <section class="tasks-section">

            <h2>Tasks</h2>

            <div id="taskList">
                <!-- Tasks will appear here -->
            </div>

        </section>

    </main>

    <div id="recordingOverlay" class="recording-overlay hidden" hidden role="dialog" aria-modal="true" aria-labelledby="recordingTitle">
        <div class="recording-card">
            <div class="recording-orb" aria-hidden="true">
                <span class="recording-wave wave-one"></span>
                <span class="recording-wave wave-two"></span>
                <span class="recording-mic">🎙</span>
            </div>
            <p class="recording-status" id="recordingStatus">Listening...</p>
            <h2 id="recordingTitle">Tell me what needs doing</h2>
            <p class="recording-hint" id="recordingHint">Tap Stop when you finish speaking.</p>
            <div class="recording-actions">
                <button id="recordingStopButton" class="recording-stop-button" type="button">Stop recording</button>
                <button id="recordingCancelButton" class="recording-cancel-button" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <div id="aiModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">
            <h2>AI Found These Tasks</h2>

            <button id="closeModal" class="close-button">
                ✕
            </button>
        </div>

        <p id="aiTranscript" class="ai-transcript"></p>

        <div id="aiTaskList"></div>

        <div class="modal-actions">

            <button id="cancelAiTasks" class="cancel-button">
                Cancel
            </button>

            <button id="addAiTasks" class="confirm-button">
                Add All
            </button>

        </div>

    </div>

    </div>
    <script src="/static/script.js" defer></script>

</body>
</html>
